<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" width="1280" height="730" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Hive: arquitetura da plataforma</title>
  <style>
    .ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
    .card{fill:#ffffff;stroke:#dbe2ea;stroke-width:1.2}
    .ptitle{font-size:13px;font-weight:700;letter-spacing:.08em}
    .t{font-size:14px;font-weight:700;fill:#0f172a}
    .s{font-size:11.5px;fill:#64748b}
    .flow{fill:none;stroke:#94a3b8;stroke-width:2}
    .dash{stroke-dasharray:6 5}
    .lbl{font-size:11px;fill:#475569;font-style:italic}
    .badge circle{fill:#0f172a}
    .badge text{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    .chip rect{fill:#eef2ff}
    .chip text{font-size:11px;fill:#3730a3;text-anchor:middle;font-weight:600}
    .av text.i{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}
    .av text.n{font-size:12px;font-weight:700;fill:#0f172a;text-anchor:middle}
    .av text.r{font-size:10.5px;fill:#64748b;text-anchor:middle}
    .gl{font-size:11px;font-weight:700;letter-spacing:.06em}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#94a3b8"/>
    </marker>
    <symbol id="i-monitor" viewBox="0 0 24 24"><g class="ic"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></g></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><g class="ic"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9z"/></g></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><g class="ic"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></g></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><g class="ic"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></g></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g class="ic"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><g class="ic"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v12h16V8M10 12h4"/></g></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="12" r="10"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.6 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></g></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="12" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v9M12 11c-4 0-7 2-7 5.5M12 11c4 0 7 2 7 5.5"/></g></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><g class="ic"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10"/></g></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><g class="ic"><path d="M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><g class="ic"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20.5 11a4 4 0 0 1-3 8z"/></g></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><g class="ic"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></g></symbol>
    <symbol id="i-hub" viewBox="0 0 24 24"><g class="ic"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="20" r="2"/><path d="M5.5 5.5 9.8 9.8M18.5 5.5l-4.3 4.3M5.5 18.5l4.3-4.3M18.5 18.5l-4.3-4.3"/></g></symbol>
  </defs>

  <!-- fundo claro (legível também no tema escuro do GitHub) -->
  <rect width="1280" height="730" rx="18" fill="#f8fafc"/>
  <text x="30" y="44" font-size="22" font-weight="800" fill="#0f172a">Hive</text>
  <text x="92" y="44" font-size="15" fill="#64748b">um time de agentes de IA que transforma um pedido em um site publicado, com aprovação humana e custo rastreado</text>

  <!-- ================= CANAIS ================= -->
  <rect class="panel" x="30" y="70" width="210" height="360" rx="14"/>
  <text class="ptitle" x="48" y="98" fill="#7c3aed">CANAIS</text>

  <rect class="card" x="45" y="115" width="180" height="90" rx="12"/>
  <rect x="59" y="129" width="36" height="36" rx="9" fill="#ede9fe"/>
  <use href="#i-monitor" x="65" y="135" width="24" height="24" stroke="#7c3aed"/>
  <text class="t" x="105" y="145">Console web</text>
  <text class="s" x="105" y="162">React · tempo real</text>
  <text class="s" x="59" y="188">acompanha e aprova</text>

  <rect class="card" x="45" y="225" width="180" height="90" rx="12"/>
  <rect x="59" y="239" width="36" height="36" rx="9" fill="#ede9fe"/>
  <use href="#i-send" x="65" y="245" width="24" height="24" stroke="#7c3aed"/>
  <text class="t" x="105" y="255">Telegram</text>
  <text class="s" x="105" y="272">bot</text>
  <text class="s" x="59" y="298">pede e recebe avisos</text>

  <rect class="card dash" x="45" y="335" width="180" height="80" rx="12" stroke="#c4b5fd"/>
  <rect x="59" y="349" width="36" height="36" rx="9" fill="#f5f3ff"/>
  <use href="#i-chat" x="65" y="355" width="24" height="24" stroke="#a78bfa"/>
  <text class="t" x="105" y="365" fill="#64748b">WhatsApp</text>
  <text class="s" x="105" y="382">Slack · Teams</text>
  <text class="s" x="59" y="405" font-style="italic">a construir</text>

  <!-- ================= COMO LER ================= -->
  <rect class="panel" x="30" y="450" width="210" height="250" rx="14"/>
  <text class="ptitle" x="48" y="478" fill="#334155">COMO LER</text>
  <g class="badge"><circle cx="56" cy="503" r="10"/><text x="56" y="507">1</text></g>
  <text class="s" x="74" y="501">O pedido chega por um</text><text class="s" x="74" y="515">canal e entra pela API.</text>
  <g class="badge"><circle cx="56" cy="541" r="10"/><text x="56" y="545">2</text></g>
  <text class="s" x="74" y="539">Uma pessoa aprova o</text><text class="s" x="74" y="553">plano e o go-live.</text>
  <g class="badge"><circle cx="56" cy="579" r="10"/><text x="56" y="583">3</text></g>
  <text class="s" x="74" y="577">O Atlas divide o trabalho</text><text class="s" x="74" y="591">entre os especialistas.</text>
  <g class="badge"><circle cx="56" cy="617" r="10"/><text x="56" y="621">4</text></g>
  <text class="s" x="74" y="615">Toda chamada de LLM passa</text><text class="s" x="74" y="629">pelo roteador e tem custo.</text>
  <g class="badge"><circle cx="56" cy="655" r="10"/><text x="56" y="659">5</text></g>
  <text class="s" x="74" y="653">Cada passo vira evento</text><text class="s" x="74" y="667">numa trilha à prova de edição.</text>
  <path class="flow dash" d="M50 686h28"/><text class="s" x="86" y="690">a construir</text>

  <!-- ================= NÚCLEO ================= -->
  <rect class="panel" x="270" y="70" width="500" height="450" rx="14"/>
  <text class="ptitle" x="288" y="98" fill="#4338ca">NÚCLEO · independente de domínio</text>

  <!-- API -->
  <rect class="card" x="290" y="115" width="200" height="85" rx="12"/>
  <rect x="304" y="129" width="36" height="36" rx="9" fill="#e0e7ff"/>
  <use href="#i-server" x="310" y="135" width="24" height="24" stroke="#4338ca"/>
  <text class="t" x="350" y="145">API</text>
  <text class="s" x="350" y="162">FastAPI · REST + SSE</text>
  <text class="s" x="304" y="186">missões, aprovações, eventos</text>
  <g class="badge"><circle cx="490" cy="115" r="11"/><text x="490" y="119">1</text></g>

  <!-- Portões humanos -->
  <rect class="card" x="290" y="215" width="200" height="70" rx="12" stroke="#fda4af"/>
  <rect x="304" y="232" width="36" height="36" rx="9" fill="#ffe4e6"/>
  <use href="#i-user" x="310" y="238" width="24" height="24" stroke="#e11d48"/>
  <text class="t" x="350" y="246">Portões humanos</text>
  <text class="s" x="350" y="263">plano · implantação</text>
  <g class="badge"><circle cx="490" cy="215" r="11"/><text x="490" y="219">2</text></g>

  <!-- Engine -->
  <rect class="card" x="550" y="115" width="200" height="170" rx="12"/>
  <rect x="564" y="129" width="36" height="36" rx="9" fill="#e0e7ff"/>
  <use href="#i-gear" x="570" y="135" width="24" height="24" stroke="#4338ca"/>
  <text class="t" x="610" y="145">Engine</text>
  <text class="s" x="610" y="162">máquina de estados</text>
  <text class="s" x="564" y="188">retomável após reinício</text>
  <g class="chip"><rect x="564" y="202" width="82" height="24" rx="12"/><text x="605" y="218">DoR</text></g>
  <g class="chip"><rect x="654" y="202" width="82" height="24" rx="12"/><text x="695" y="218">DAG</text></g>
  <g class="chip"><rect x="564" y="234" width="82" height="24" rx="12"/><text x="605" y="250">retrabalho</text></g>
  <g class="chip"><rect x="654" y="234" width="82" height="24" rx="12"/><text x="695" y="250">orçamento</text></g>

  <!-- EventBus / Auditoria / Artefatos -->
  <rect class="card" x="290" y="305" width="140" height="95" rx="12"/>
  <rect x="304" y="317" width="36" height="36" rx="9" fill="#e0e7ff"/>
  <use href="#i-radio" x="310" y="323" width="24" height="24" stroke="#4338ca"/>
  <text class="t" x="304" y="372">EventBus</text>
  <text class="s" x="304" y="389">alimenta o console</text>

  <rect class="card" x="450" y="305" width="140" height="95" rx="12"/>
  <rect x="464" y="317" width="36" height="36" rx="9" fill="#d1fae5"/>
  <use href="#i-shield" x="470" y="323" width="24" height="24" stroke="#059669"/>
  <text class="t" x="464" y="372">Auditoria</text>
  <text class="s" x="464" y="389">hash chain SHA-256</text>
  <g class="badge"><circle cx="590" cy="400" r="11"/><text x="590" y="404">5</text></g>

  <rect class="card" x="610" y="305" width="140" height="95" rx="12"/>
  <rect x="624" y="317" width="36" height="36" rx="9" fill="#d1fae5"/>
  <use href="#i-box" x="630" y="323" width="24" height="24" stroke="#059669"/>
  <text class="t" x="624" y="372">Artefatos</text>
  <text class="s" x="624" y="389">v1, v2… · disco / S3</text>

  <!-- FinOps / Roteador -->
  <rect class="card" x="290" y="420" width="140" height="85" rx="12"/>
  <rect x="304" y="432" width="36" height="36" rx="9" fill="#d1fae5"/>
  <use href="#i-coin" x="310" y="438" width="24" height="24" stroke="#059669"/>
  <text class="t" x="304" y="484">FinOps</text>
  <text class="s" x="304" y="499">US$ por agente/missão</text>

  <rect class="card" x="450" y="420" width="300" height="85" rx="12"/>
  <rect x="464" y="434" width="36" height="36" rx="9" fill="#ffedd5"/>
  <use href="#i-route" x="470" y="440" width="24" height="24" stroke="#ea580c"/>
  <text class="t" x="510" y="450">Roteador de LLM</text>
  <text class="s" x="510" y="467">escolhe o provedor por papel</text>
  <text class="s" x="464" y="492">ex.: orquestrador no Claude, resto na GPU</text>
  <g class="badge"><circle cx="750" cy="420" r="11"/><text x="750" y="424">4</text></g>

  <!-- ================= PROVEDORES ================= -->
  <rect class="panel" x="270" y="550" width="500" height="150" rx="14"/>
  <text class="ptitle" x="288" y="578" fill="#ea580c">PROVEDORES DE LLM</text>

  <rect class="card" x="290" y="595" width="107" height="90" rx="12"/>
  <rect x="302" y="606" width="32" height="32" rx="8" fill="#ffedd5"/>
  <use href="#i-flask" x="307" y="611" width="22" height="22" stroke="#ea580c"/>
  <text class="t" x="302" y="659">mock</text>
  <text class="s" x="302" y="675">demo e testes</text>

  <rect class="card" x="407" y="595" width="107" height="90" rx="12"/>
  <rect x="419" y="606" width="32" height="32" rx="8" fill="#ffedd5"/>
  <use href="#i-spark" x="424" y="611" width="22" height="22" stroke="#ea580c"/>
  <text class="t" x="419" y="659">Claude</text>
  <text class="s" x="419" y="675">API Anthropic</text>

  <rect class="card" x="524" y="595" width="107" height="90" rx="12"/>
  <rect x="536" y="606" width="32" height="32" rx="8" fill="#ffedd5"/>
  <use href="#i-cloud" x="541" y="611" width="22" height="22" stroke="#ea580c"/>
  <text class="t" x="536" y="659">Bedrock</text>
  <text class="s" x="536" y="675">AWS · IAM</text>

  <rect class="card" x="641" y="595" width="107" height="90" rx="12"/>
  <rect x="653" y="606" width="32" height="32" rx="8" fill="#ffedd5"/>
  <use href="#i-cpu" x="658" y="611" width="22" height="22" stroke="#ea580c"/>
  <text class="t" x="653" y="659">Ollama</text>
  <text class="s" x="653" y="675">GPU local</text>

  <!-- ================= AGENTES ================= -->
  <rect class="panel" x="800" y="70" width="450" height="630" rx="14"/>
  <text class="ptitle" x="818" y="98" fill="#0f172a">AGENTES · pacote de domínio “sites”</text>

  <rect class="card" x="820" y="115" width="410" height="80" rx="12" stroke="#a5b4fc"/>
  <rect x="834" y="137" width="36" height="36" rx="9" fill="#e0e7ff"/>
  <use href="#i-hub" x="840" y="143" width="24" height="24" stroke="#4338ca"/>
  <text class="t" x="880" y="150">Atlas · Orquestrador</text>
  <text class="s" x="880" y="168">interpreta o pedido, monta o plano e delega</text>
  <g class="badge"><circle cx="1230" cy="115" r="11"/><text x="1230" y="119">3</text></g>

  <!-- Planejamento -->
  <rect x="820" y="210" width="410" height="100" rx="12" fill="#eef2ff"/>
  <text class="gl" x="834" y="230" fill="#4f46e5">PLANEJAMENTO</text>
  <g class="av"><circle cx="870" cy="257" r="18" fill="#4f46e5"/><text class="i" x="870" y="262">P</text><text class="n" x="870" y="290">Paula</text><text class="r" x="870" y="303">Product Owner</text></g>
  <g class="av"><circle cx="970" cy="257" r="18" fill="#4f46e5"/><text class="i" x="970" y="262">A</text><text class="n" x="970" y="290">Arthur</text><text class="r" x="970" y="303">Arquiteto</text></g>

  <!-- Criação -->
  <rect x="820" y="318" width="410" height="100" rx="12" fill="#fef3c7"/>
  <text class="gl" x="834" y="338" fill="#b45309">CRIAÇÃO</text>
  <g class="av"><circle cx="870" cy="365" r="18" fill="#d97706"/><text class="i" x="870" y="370">D</text><text class="n" x="870" y="398">Diana</text><text class="r" x="870" y="411">Designer</text></g>
  <g class="av"><circle cx="970" cy="365" r="18" fill="#d97706"/><text class="i" x="970" y="370">C</text><text class="n" x="970" y="398">Caio</text><text class="r" x="970" y="411">Redator / SEO</text></g>
  <g class="av"><circle cx="1070" cy="365" r="18" fill="#d97706"/><text class="i" x="1070" y="370">Í</text><text class="n" x="1070" y="398">Íris</text><text class="r" x="1070" y="411">Ilustradora</text></g>
  <g class="av"><circle cx="1170" cy="365" r="18" fill="#d97706"/><text class="i" x="1170" y="370">D</text><text class="n" x="1170" y="398">Diego</text><text class="r" x="1170" y="411">Desenvolvedor</text></g>

  <!-- Verificação -->
  <rect x="820" y="426" width="410" height="100" rx="12" fill="#cffafe"/>
  <text class="gl" x="834" y="446" fill="#0e7490">VERIFICAÇÃO</text>
  <text class="s" x="1216" y="446" text-anchor="end" fill="#0e7490">reprovou? volta para a criação ↺</text>
  <g class="av"><circle cx="870" cy="473" r="18" fill="#0891b2"/><text class="i" x="870" y="478">V</text><text class="n" x="870" y="506">Vera</text><text class="r" x="870" y="519">Fatos</text></g>
  <g class="av"><circle cx="970" cy="473" r="18" fill="#0891b2"/><text class="i" x="970" y="478">Q</text><text class="n" x="970" y="506">Quésia</text><text class="r" x="970" y="519">QA</text></g>

  <!-- Entrega -->
  <rect x="820" y="534" width="410" height="100" rx="12" fill="#dcfce7"/>
  <text class="gl" x="834" y="554" fill="#15803d">ENTREGA</text>
  <g class="av"><circle cx="870" cy="581" r="18" fill="#16a34a"/><text class="i" x="870" y="586">N</text><text class="n" x="870" y="614">Nuvem</text><text class="r" x="870" y="627">Cloud / DevOps</text></g>
  <g class="av"><circle cx="970" cy="581" r="18" fill="#16a34a"/><text class="i" x="970" y="586">F</text><text class="n" x="970" y="614">Fábio</text><text class="r" x="970" y="627">FinOps</text></g>

  <text class="s" x="1025" y="668" text-anchor="middle">novos nichos entram como novos agentes + plano de referência</text>

  <!-- ================= FLUXOS ================= -->
  <path class="flow" d="M225 157H286" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="flow" d="M225 270C258 270 258 178 286 178" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="flow dash" d="M225 375C264 375 264 192 286 192" marker-end="url(#arr)"/>
  <path class="flow" d="M490 157H546" marker-end="url(#arr)"/>
  <path class="flow" d="M494 250H546" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path class="flow" d="M600 285V295H360V301" marker-end="url(#arr)"/>
  <path class="flow" d="M430 352H446" marker-end="url(#arr)"/>
  <path class="flow" d="M750 155H816" marker-end="url(#arr)"/>
  <text class="lbl" x="783" y="147" text-anchor="middle">delega</text>
  <path class="flow" d="M820 352H754" marker-end="url(#arr)"/>
  <text class="lbl" x="785" y="344" text-anchor="middle">salva</text>
  <path class="flow" d="M820 470H754" marker-end="url(#arr)"/>
  <text class="lbl" x="785" y="462" text-anchor="middle">pede</text>
  <path class="flow" d="M450 462H434" marker-end="url(#arr)"/>
  <path class="flow" d="M600 505V546" marker-end="url(#arr)"/>
</svg>
